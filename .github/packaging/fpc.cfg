#
# TunnelPascal compiler configuration file.
#
# Installed by .github/packaging/finalize-package.sh; see that script for where
# this file is placed and why.
#
# Every path is written relative to $FPCBINDIR -- the directory of the compiler
# binary that is actually running -- so the release archive can be unpacked
# anywhere. $FPCVERSION and $FPCTARGET are expanded by the compiler itself
# (3.3.1 and e.g. x86_64-linux), not by the fpc driver.
#

# Unix layout: the compiler lives in <prefix>/lib/fpc/$FPCVERSION/, with the
# units right next to it. (FPC resolves paramstr(0) through /proc/self/exe, so
# $FPCBINDIR is this real directory even when invoked via <prefix>/bin/ppcx64.)
-Fu$FPCBINDIR/units/$FPCTARGET
-Fu$FPCBINDIR/units/$FPCTARGET/*
-Fu$FPCBINDIR/units/$FPCTARGET/rtl

# Windows layout: a zip cannot carry symlinks, so the compiler is copied into
# <prefix>/bin/ and has to reach back into lib/. A -Fu path that does not exist
# is ignored, so both layouts can share one config file.
-Fu$FPCBINDIR/../lib/fpc/$FPCVERSION/units/$FPCTARGET
-Fu$FPCBINDIR/../lib/fpc/$FPCVERSION/units/$FPCTARGET/*
-Fu$FPCBINDIR/../lib/fpc/$FPCVERSION/units/$FPCTARGET/rtl
