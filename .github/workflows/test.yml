name: TestBuild (x86_64)

on: [push, pull_request]

env:
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US:en"
  LC_ALL: "en_US.UTF-8"

jobs:
  testbuild:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2
      - name: Build FPC
        run: |
          fpcmake
          make -j 4 all FPMAKEOPT="-T 4" "OPT=-Oodfa"
      - name: Build Tests
        run: |
          FPC_SRC=$(pwd)
          PP=$FPC_SRC/compiler/ppcx64
          cd tests
          fpcmake
          make full TEST_FPC=$PP TEST_DELTEMP=1 -j 4
          cd utils
          fpcmake
          make fpts2junit
      - name: Aggregate Results
        run: |
          FPC_SRC=$(pwd)
          tests/utils/fpts2junit "$FPC_SRC/tests/output/x86_64-linux/" testresult.xml

          # Extract the set of failing/errored tests as "<classname>/<name>".
          python3 - testresult.xml > failed.txt <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          for tc in root.iter("testcase"):
              if tc.find("failure") is not None or tc.find("error") is not None:
                  print((tc.get("classname", "") + "/" + tc.get("name", "")).strip())
          PY
          sort -u -o failed.txt failed.txt

          # Allowlist of upstream-inherited failures (also fail on pristine fpc/main).
          grep -vE '^\s*#|^\s*$' .github/known_failures.txt | sort -u > known.txt

          # Filtered report for the JUnit reporter: turn allowlisted failures into
          # "skipped" so the report check reflects only UNEXPECTED failures. The
          # full, unfiltered testresult.xml is still uploaded as the artifact.
          python3 - testresult.xml known.txt testresult.report.xml <<'PY'
          import sys, xml.etree.ElementTree as ET
          src, known_file, dst = sys.argv[1], sys.argv[2], sys.argv[3]
          known = {l.strip() for l in open(known_file) if l.strip() and not l.startswith("#")}
          tree = ET.parse(src); root = tree.getroot()
          df = de = 0
          for tc in root.iter("testcase"):
              key = (tc.get("classname", "") + "/" + tc.get("name", "")).strip()
              if key in known:
                  f, e = tc.find("failure"), tc.find("error")
                  if f is not None: tc.remove(f); df += 1
                  if e is not None: tc.remove(e); de += 1
                  if f is not None or e is not None:
                      ET.SubElement(tc, "skipped")
          for attr, n in (("failures", df), ("errors", de)):
              root.set(attr, str(max(0, int(root.get(attr, "0")) - n)))
          tree.write(dst, encoding="utf-8", xml_declaration=True)
          PY

          NEW=$(comm -23 failed.txt known.txt)          # failing but not allowlisted -> real regressions
          STALE=$(comm -13 failed.txt known.txt)        # allowlisted but now passing -> trim the list

          echo "Failing: $(wc -l < failed.txt) | Known-allowed: $(wc -l < known.txt) | New: $(printf '%s' "$NEW" | grep -c . )"

          if [ -n "$STALE" ]; then
            echo "::warning::These allowlisted tests now PASS and should be removed from .github/known_failures.txt:"
            printf '%s\n' "$STALE"
          fi

          if [ -n "$NEW" ]; then
            echo "::error::New test failures not in the known-failures allowlist:"
            printf '%s\n' "$NEW"
            exit 1
          fi
          echo "No new failures beyond the known upstream-inherited set."
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: testresult.xml
          path: ./testresult.xml
      - name: Report
        uses: mikepenz/action-junit-report@v4
        if: success() || failure()
        with:
          report_paths: './testresult.report.xml'
