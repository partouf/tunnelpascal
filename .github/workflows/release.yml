name: Release

on: [push]

env:
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US:en"
  LC_ALL: "en_US.UTF-8"

jobs:
  release-build:
    runs-on: ubuntu-22.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2
      - name: Build FPC
        run: |
          fpcmake
          make -j 4 zipinstall FPMAKEOPT="-T 4" "OPT=-Oodfa"
      - name: Finalize and verify package
        # Name must match GHR_PATH in the Release step below.
        run: |
          mkdir build
          tar xzf fpc-*.x86_64-linux.tar.gz -C build
          rm fpc-*.x86_64-linux.tar.gz
          .github/packaging/finalize-package.sh build
          .github/packaging/verify-package.sh build
          (cd build && tar -czf ../tunnel-pascal-regular.x86_64-linux.tar.gz *)
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_PATH: /home/runner/work/tunnelpascal/tunnelpascal/tunnel-pascal-regular.x86_64-linux.tar.gz
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bleeding-edge-build:
    runs-on: ubuntu-22.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2
      - name: Prepare
        run: |
          FPC_SRC="$(pwd)"
          PACKDIR="$FPC_SRC/build"
          LIBDIR=$PACKDIR/lib/fpc/3.3.1
          mkdir "$PACKDIR"
          echo "PACKDIR=$PACKDIR" >> "$GITHUB_ENV"
          echo "LIBDIR=$LIBDIR" >> "$GITHUB_ENV"
      - name: Build Compiler (bootstrap)
        run: |
          make -C compiler FPMAKEOPT="-T 4" "OPTS=-O3 -dEXTDEBUG" "INSTALL_PREFIX=$PACKDIR" all
          make -C compiler "INSTALL_PREFIX=$PACKDIR" ZIPINSTALL=1 install
          mv "$PACKDIR/lib/fpc/3.2.2" "$LIBDIR"
          PP=$LIBDIR/ppcx64
          echo "PP=$PP" >> "$GITHUB_ENV"
      - name: Build RTL for FPMAKE
        run: |
          # The bootstrap step compiles the in-tree RTL with the apt fpc-3.2.2
          # (PPU v207). Clean it first so it is rebuilt with the freshly built
          # compiler ($PP, PPU v208); otherwise fpmake loads the stale v207
          # system.ppu and fails with "Can't find unit system".
          make -C rtl "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" clean
          make -C rtl "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" all
          make -C packages "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" fpmake
          make -C rtl "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" clean
      - name: Build RTL and packages with DottedUnits
        run: |
          make -C rtl FPC_DOTTEDUNITS=1 "PP=$PP" "FPCDIR=$LIBDIR" FPMAKEOPT="-T 4" "OPT=-O3" "INSTALL_PREFIX=$PACKDIR" all
          make -C rtl FPC_DOTTEDUNITS=1 "PP=$PP" "FPCDIR=$LIBDIR" FPMAKEOPT="-T 4" "OPT=-O3" "INSTALL_PREFIX=$PACKDIR" install
          make -C packages "FPC_DOTTEDUNITS=1" "PP=$PP" "FPCDIR=$LIBDIR" FPMAKEOPT="-T 4" "OPT=-O3" "INSTALL_PREFIX=$PACKDIR" all
          make -C packages "FPC_DOTTEDUNITS=1" "PP=$PP" "FPCDIR=$LIBDIR" FPMAKEOPT="-T 4" "OPT=-O3" "INSTALL_PREFIX=$PACKDIR" install
      - name: Finalize and verify package
        run: |
          .github/packaging/finalize-package.sh "$PACKDIR"
          .github/packaging/verify-package.sh "$PACKDIR"
      - name: Create tgz
        run: |
          pushd build
          tar -cf ../tunnel-pascal.tar *
          popd
          gzip tunnel-pascal.tar
          mv tunnel-pascal.tar.gz tunnel-pascal-bleeding-edge.x86_64-linux.tar.gz
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_PATH: /home/runner/work/tunnelpascal/tunnelpascal/tunnel-pascal-bleeding-edge.x86_64-linux.tar.gz
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cross-arm-build:
    # Cross compiler that runs on x86_64-linux and targets 32-bit ARM Linux.
    # Profile: ARMv6 + VFPv2 + EABIHF (hard float) — i.e. Raspberry Pi 1 / Pi Zero
    # and Raspbian armhf. Newer Pis (2/3/4/5) run these binaries too.
    runs-on: ubuntu-22.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install prerequisites
        # binutils-arm-linux-gnueabihf provides the arm-linux-gnueabihf-{as,ld}
        # the cross compiler shells out to.
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2 binutils-arm-linux-gnueabihf
      - name: Prepare
        run: |
          FPC_SRC="$(pwd)"
          PACKDIR="$FPC_SRC/build"
          LIBDIR=$PACKDIR/lib/fpc/3.3.1
          mkdir "$PACKDIR"
          echo "PACKDIR=$PACKDIR" >> "$GITHUB_ENV"
          echo "LIBDIR=$LIBDIR" >> "$GITHUB_ENV"
      - name: Build Compiler (bootstrap)
        # Build a current native compiler from source first. The cross build must
        # bootstrap with a matching PPU version (v208); the apt fpc-3.2.2 is v207
        # and the aarch64/arm RTL (which uses the generic.inc atomic intrinsics)
        # fails against a mismatched bootstrap. Same rationale as commit #5.
        run: |
          make -C compiler FPMAKEOPT="-T 4" "OPTS=-O2" "INSTALL_PREFIX=$PACKDIR" all
          make -C compiler "INSTALL_PREFIX=$PACKDIR" ZIPINSTALL=1 install
          mv "$PACKDIR/lib/fpc/3.2.2" "$LIBDIR"
          PP=$LIBDIR/ppcx64
          echo "PP=$PP" >> "$GITHUB_ENV"
      - name: Rebuild native RTL with built compiler
        # Replace the v207 RTL (built by apt fpc-3.2.2 during the bootstrap) with
        # a v208 RTL built by $PP, so the shipped native compiler + RTL match and
        # so the cross bootstrap finds a consistent system.ppu.
        run: |
          make -C rtl "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" clean
          make -C rtl "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" all install
      - name: Build ARMv6 hard-float cross compiler + RTL + packages
        # -dFPC_ARMHF      -> compiler defaults the arm-linux target to abi_eabihf
        #                     (hard float, matching Raspbian armhf / libc)
        # -CpARMV6 -CfVFPV2 (CROSSOPT) -> RTL & packages built for ARMv6 + VFPv2
        # crossinstall installs ppcrossarm + units/arm-linux into $PACKDIR.
        run: |
          make crossall crossinstall \
            CPU_TARGET=arm OS_TARGET=linux \
            BINUTILSPREFIX=arm-linux-gnueabihf- \
            "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" \
            "OPT=-dFPC_ARMHF" "CROSSOPT=-CpARMV6 -CfVFPV2"
      - name: Finalize and verify package
        run: |
          .github/packaging/finalize-package.sh "$PACKDIR" 3.3.1 arm-linux-gnueabihf-
          .github/packaging/verify-package.sh "$PACKDIR"
          .github/packaging/verify-package.sh "$PACKDIR" -Parm
      - name: Create tgz
        run: |
          pushd build
          tar -cf ../tunnel-pascal-cross-arm.tar *
          popd
          gzip tunnel-pascal-cross-arm.tar
          # Name encodes target (arm-linux, armv6 hard-float) and host (x86_64-linux).
          mv tunnel-pascal-cross-arm.tar.gz tunnel-pascal-cross-armv6hf.arm-linux.x86_64-linux.tar.gz
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_PATH: /home/runner/work/tunnelpascal/tunnelpascal/tunnel-pascal-cross-armv6hf.arm-linux.x86_64-linux.tar.gz
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-x64-build:
    # Native Windows x64 FPC, BUILT ON LINUX. The FPC project produces its
    # Windows releases this way: targeting OS_TARGET=win64 yields a native
    # Windows compiler (ppcx64.exe) plus win64 RTL/packages/utils — all native
    # Windows PE binaries. Only the build host is Linux, so this runs on the
    # same ubuntu runner as the other jobs (no Windows runner needed).
    runs-on: ubuntu-22.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install prerequisites
        # win64 uses FPC's internal assembler + linker, so no mingw binutils are
        # needed; the apt fpc-3.2.2 is only the bootstrap starting compiler.
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2
      - name: Build native win64 FPC (compiler + RTL + packages + utils)
        run: |
          make all CPU_TARGET=x86_64 OS_TARGET=win64 FPMAKEOPT="-T 4" "OPT=-O2"
          make install CPU_TARGET=x86_64 OS_TARGET=win64 "INSTALL_PREFIX=$(pwd)/build-win64"
      - name: Finalize package
        run: .github/packaging/finalize-package.sh build-win64
      - name: Create zip
        run: |
          cd build-win64
          zip -r -q ../tunnel-pascal-regular.x86_64-win64.zip .
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_PATH: /home/runner/work/tunnelpascal/tunnelpascal/tunnel-pascal-regular.x86_64-win64.zip
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bleeding-edge-windows-x64-build:
    # Native Windows x64 FPC with a dotted/namespaced RTL + packages
    # (System.SysUtils, WinApi.Windows, ...). Built on Linux like the regular
    # win64 job. Ships dotted-only units (like the x86_64-linux bleeding-edge):
    # the regular build is used only for the native compiler + driver, then the
    # non-dotted units are dropped and replaced with the dotted ones. (Both unit
    # sets can't coexist: same-filename units like system.ppu would collide.)
    runs-on: ubuntu-22.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2
      - name: Build native win64 FPC (for the compiler + driver)
        run: |
          make all CPU_TARGET=x86_64 OS_TARGET=win64 FPMAKEOPT="-T 4" "OPT=-O2"
          make install CPU_TARGET=x86_64 OS_TARGET=win64 "INSTALL_PREFIX=$(pwd)/build-win64"
      - name: Replace units with dotted (namespaced) RTL + packages
        # The win64 build leaves the win64 cross compiler at compiler/ppcrossx64.
        # Drop the non-dotted units (keep the compiler/driver), then rebuild RTL
        # and packages with FPC_DOTTEDUNITS=1. Clean the in-tree RTL/packages
        # first so the dotted build doesn't see stale non-dotted PPUs (which
        # would fail with "checksum changed for system.ppu").
        run: |
          PP="$(pwd)/compiler/ppcrossx64"
          LIBDIR="$(pwd)/build-win64/lib/fpc/3.3.1"
          rm -rf "$LIBDIR/units/x86_64-win64"
          make -C rtl FPC_DOTTEDUNITS=1 "PP=$PP" CPU_TARGET=x86_64 OS_TARGET=win64 "FPCDIR=$LIBDIR" clean
          make -C rtl FPC_DOTTEDUNITS=1 "PP=$PP" CPU_TARGET=x86_64 OS_TARGET=win64 "FPCDIR=$LIBDIR" FPMAKEOPT="-T 4" "OPT=-O2" "INSTALL_PREFIX=$(pwd)/build-win64" all install
          make -C packages FPC_DOTTEDUNITS=1 "PP=$PP" CPU_TARGET=x86_64 OS_TARGET=win64 "FPCDIR=$LIBDIR" clean
          make -C packages FPC_DOTTEDUNITS=1 "PP=$PP" CPU_TARGET=x86_64 OS_TARGET=win64 "FPCDIR=$LIBDIR" FPMAKEOPT="-T 4" "OPT=-O2" "INSTALL_PREFIX=$(pwd)/build-win64" all install
      - name: Finalize package
        run: .github/packaging/finalize-package.sh build-win64
      - name: Create zip
        run: |
          cd build-win64
          zip -r -q ../tunnel-pascal-bleeding-edge.x86_64-win64.zip .
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_PATH: /home/runner/work/tunnelpascal/tunnelpascal/tunnel-pascal-bleeding-edge.x86_64-win64.zip
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bleeding-edge-cross-arm-build:
    # Same ARMv6 + VFPv2 + EABIHF cross compiler as cross-arm-build, but with the
    # dotted/namespaced RTL AND packages (System.SysUtils, etc.). arm-linux uses
    # the unix package set (no Windows WinApi units), so the full dotted package
    # set cross-installs cleanly. (The lua package is skipped by fpmake when its
    # external lib is absent, same as the x86_64-linux bleeding-edge.)
    runs-on: ubuntu-22.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2 binutils-arm-linux-gnueabihf
      - name: Prepare
        run: |
          FPC_SRC="$(pwd)"
          PACKDIR="$FPC_SRC/build"
          LIBDIR=$PACKDIR/lib/fpc/3.3.1
          mkdir "$PACKDIR"
          echo "PACKDIR=$PACKDIR" >> "$GITHUB_ENV"
          echo "LIBDIR=$LIBDIR" >> "$GITHUB_ENV"
      - name: Build Compiler (bootstrap)
        run: |
          make -C compiler FPMAKEOPT="-T 4" "OPTS=-O2" "INSTALL_PREFIX=$PACKDIR" all
          make -C compiler "INSTALL_PREFIX=$PACKDIR" ZIPINSTALL=1 install
          mv "$PACKDIR/lib/fpc/3.2.2" "$LIBDIR"
          PP=$LIBDIR/ppcx64
          echo "PP=$PP" >> "$GITHUB_ENV"
      - name: Rebuild native RTL with built compiler
        run: |
          make -C rtl "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" clean
          make -C rtl "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" all install
      - name: Build ARMv6 hard-float cross compiler + RTL + packages (non-dotted)
        run: |
          make crossall crossinstall \
            CPU_TARGET=arm OS_TARGET=linux \
            BINUTILSPREFIX=arm-linux-gnueabihf- \
            "PP=$PP" "FPCDIR=$LIBDIR" "INSTALL_PREFIX=$PACKDIR" \
            "OPT=-dFPC_ARMHF" "CROSSOPT=-CpARMV6 -CfVFPV2"
      - name: Replace units with dotted (namespaced) RTL + packages
        # crossall leaves the cross compiler at compiler/ppcrossarm. Drop the
        # non-dotted arm units (keep ppcrossarm), then rebuild RTL and packages
        # with FPC_DOTTEDUNITS=1 so the artifact is dotted-only (like the linux
        # bleeding-edge); same-filename units like system.ppu can't coexist.
        # Clean the in-tree RTL/packages first so the dotted build doesn't see
        # stale non-dotted PPUs ("checksum changed for system.ppu").
        # BINUTILSPREFIX is required here too (the RTL assembles arm startup code).
        run: |
          PPARM="$(pwd)/compiler/ppcrossarm"
          rm -rf "$LIBDIR/units/arm-linux"
          make -C rtl FPC_DOTTEDUNITS=1 "PP=$PPARM" CPU_TARGET=arm OS_TARGET=linux BINUTILSPREFIX=arm-linux-gnueabihf- "FPCDIR=$LIBDIR" "CROSSOPT=-CpARMV6 -CfVFPV2" clean
          make -C rtl FPC_DOTTEDUNITS=1 "PP=$PPARM" CPU_TARGET=arm OS_TARGET=linux BINUTILSPREFIX=arm-linux-gnueabihf- "FPCDIR=$LIBDIR" "CROSSOPT=-CpARMV6 -CfVFPV2" FPMAKEOPT="-T 4" "OPT=-O2" "INSTALL_PREFIX=$PACKDIR" all install
          make -C packages FPC_DOTTEDUNITS=1 "PP=$PPARM" CPU_TARGET=arm OS_TARGET=linux BINUTILSPREFIX=arm-linux-gnueabihf- "FPCDIR=$LIBDIR" "CROSSOPT=-CpARMV6 -CfVFPV2" clean
          make -C packages FPC_DOTTEDUNITS=1 "PP=$PPARM" CPU_TARGET=arm OS_TARGET=linux BINUTILSPREFIX=arm-linux-gnueabihf- "FPCDIR=$LIBDIR" "CROSSOPT=-CpARMV6 -CfVFPV2" FPMAKEOPT="-T 4" "OPT=-O2" "INSTALL_PREFIX=$PACKDIR" all install
      - name: Finalize and verify package
        run: |
          .github/packaging/finalize-package.sh "$PACKDIR" 3.3.1 arm-linux-gnueabihf-
          .github/packaging/verify-package.sh "$PACKDIR"
          .github/packaging/verify-package.sh "$PACKDIR" -Parm
      - name: Create tgz
        run: |
          pushd build
          tar -cf ../tunnel-pascal-bleeding-edge-cross-arm.tar *
          popd
          gzip tunnel-pascal-bleeding-edge-cross-arm.tar
          mv tunnel-pascal-bleeding-edge-cross-arm.tar.gz tunnel-pascal-bleeding-edge-armv6hf.arm-linux.x86_64-linux.tar.gz
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_PATH: /home/runner/work/tunnelpascal/tunnelpascal/tunnel-pascal-bleeding-edge-armv6hf.arm-linux.x86_64-linux.tar.gz
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
